<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>站点已上线</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%23111'/></svg>">
<style>
  :root{--line:#e5e5e5;--muted:#6b7280;--ink:#111}
  *{box-sizing:border-box}
  body{margin:0;background:#fff;color:var(--ink);
    font:15px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
    padding:96px 24px}
  main{max-width:640px;margin:0 auto}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#16a34a;
    margin-right:8px;vertical-align:1px}
  .k{font-size:13px;color:var(--muted);letter-spacing:.02em}
  h1{font-size:30px;line-height:1.25;font-weight:600;margin:14px 0 10px;letter-spacing:-.01em}
  p{color:var(--muted);margin:0 0 28px}
  ol{margin:0;padding:0;list-style:none;counter-reset:s;border-top:1px solid var(--line)}
  ol li{counter-increment:s;padding:16px 0;border-bottom:1px solid var(--line);
    display:flex;gap:14px;align-items:baseline}
  ol li::before{content:counter(s,decimal-leading-zero);font-variant-numeric:tabular-nums;
    font-size:12px;color:var(--muted);min-width:22px}
  code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:13px;
    background:#f6f6f6;border:1px solid var(--line);border-radius:4px;padding:1px 5px}
  footer{margin-top:32px;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<main>
  <div class="k"><span class="dot"></span>HTTP 200 · Pages 已生效</div>
  <h1>静态站点跑起来了</h1>
  <p>把这个文件换成你的构建产物，或者直接删掉换成 <code>dist/</code> 里的内容。</p>
  <ol>
    <li>仓库 Settings → Pages → Source 选 <code>Deploy from a branch</code></li>
    <li>分支 <code>main</code>，目录 <code>/ (root)</code>，Save</li>
    <li>等 30–90 秒，访问 <code>https://USER.github.io/REPO/</code></li>
  </ol>
  <footer>gh-pages-kit · 白底最小模板</footer>
</main>
</body>
</html>
